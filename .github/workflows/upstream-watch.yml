name: Upstream Watch

on:
  schedule:
    # 每周一、三、五 UTC 01:00（北京时间 09:00）巡检
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/upstream-sources.json'
      - 'tools/check-upstream.py'

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check upstream sources schema
        run: python tools/check-upstream.py --lint

      - name: Compare against upstreams
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check-upstream.py

      - name: Ensure upstream-watch label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create upstream-watch --color "d93f0b" --description "社区借鉴项目上游更新待评估" --force || true

      - name: Create or update tracking issue
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ steps.check.outputs.update_count }}"
          TITLE="🔔 [Upstream Watch] 社区反代借鉴项目有新提交（${COUNT} 项待评估）"
          EXISTING=$(gh issue list --state open --label "upstream-watch" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "更新已存在的 Issue #$EXISTING"
            gh issue edit "$EXISTING" --title "$TITLE" --body-file upstream-report.md || true
          else
            gh issue create \
              --title "$TITLE" \
              --body-file upstream-report.md \
              --label "upstream-watch" || true
          fi

      - name: Retain and update issue when watch degraded
        if: steps.check.outputs.has_updates == 'false' && steps.check.outputs.has_query_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAIL_COUNT="${{ steps.check.outputs.query_failure_count }}"
          echo "⚠️ 巡检降级：本次有 ${FAIL_COUNT} 项查询失败，为防止误报不自动收口，保持跟踪。"
          EXISTING=$(gh issue list --state open --label "upstream-watch" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue edit "$EXISTING" --body-file upstream-report.md || true
            gh issue comment "$EXISTING" --body "⚠️ [Upstream Watch] 本次巡检有 ${FAIL_COUNT} 项上游仓库查询失败（受网络波动或 GitHub API 限额影响），已保留现有跟踪 Issue 并更新报告，不作虚假收口。" || true
          fi

      - name: Auto-close when caught up and all queries succeeded
        if: steps.check.outputs.has_updates == 'false' && steps.check.outputs.has_query_failures == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --state open --label "upstream-watch" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" --comment "✅ 所有借鉴源查询成功且基线与上游一致，自动收口。下次有新提交会自动重新开 Issue。" || true
          else
            echo "无待跟进项，也无未关闭 Issue，跳过。"
          fi
