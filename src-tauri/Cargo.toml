[package]
name = "codebuddy2openai"
version = "0.2.0"
description = "CodeBuddy2OpenAI 桌面控制台 — 独立登录/账号管理/反代托管，无需 WorkBuddy 桌面端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# stream: 启用 Response::bytes_stream() 逐块读取 SSE（TTFT 首字时延探测）
reqwest = { version = "0.13.4", features = ["json", "stream"] }
# StreamExt：驱动 bytes_stream 的迭代（futures-util 已在 reqwest 依赖树中，不引入新包）
futures-util = "0.3"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }
# 系统已知目录解析（%LOCALAPPDATA% / 用户主目录的通用回退；依赖树中已有 6.0.0）
dirs = "6"

[profile.release]
strip = true
lto = true
