[package]
name = "workbuddy2api"
version = "0.2.1"
description = "WorkBuddy2API 桌面控制台 — 独立登录/账号管理/反代托管，无需 WorkBuddy 桌面端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false：避免 reqwest 0.13 默认通过 rustls 拉入 aws-lc-rs/aws-lc-sys（在 Windows 上强依赖 CMake 与 NASM）；
# 改用 native-tls（Windows 下自动使用系统 SChannel，天然信任系统证书且零 C 工具链依赖）
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "charset", "http2", "native-tls", "system-proxy"] }
# StreamExt：驱动 bytes_stream 的迭代（futures-util 已在 reqwest 依赖树中，不引入新包）
futures-util = "0.3"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }
# 系统已知目录解析（%LOCALAPPDATA% / 用户主目录的通用回退；依赖树中已有 6.0.0）
dirs = "6"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
